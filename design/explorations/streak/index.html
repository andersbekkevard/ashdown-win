<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ashdown.win streak badge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Titan+One&display=swap" rel="stylesheet">
<style>


:root {
  --pink: #fb3aa3;
  --raspberry: #c81c74;
  --blue: #00b5fe;
  --deep: #0866d7;
  --banana: #fcc601;
  --gold: #ffd046;
  --mint: #5eeac0;
  --mint-deep: #17a97a;
  --lilac: #7c7be8;
  --ink: #222126;
  --paper: #ffffff;
  --cream: #fff6d5;
  --muted: #6b7080;
  --faint: #8a8fa3;
  --display: "Titan One", "Arial Rounded MT Bold", "Fredoka", system-ui, sans-serif;
  --body: "Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif;
  --dock-h: 96px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
/* Keep focused or scrolled-to elements above the fixed dock. */

body{}
a { color: inherit; text-decoration: none; }
/* The frame never scrolls; only <main> does, so iOS has nothing to bounce
   and the top bar stays put. */
.phone {
  max-width: 430px;
  margin: 0 auto;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
}
.topbar { flex: none; padding-left: 18px; padding-right: 18px; }
.phone > main {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 0 14px calc(var(--dock-h) + 8px + env(safe-area-inset-bottom));
  scroll-padding-bottom: calc(var(--dock-h) + 16px + env(safe-area-inset-bottom));
}
@media (min-width: 700px) { .phone { padding-top: 12px; } }

.shout {
  font-family: var(--display);
  font-weight: 400;
  color: var(--paper);
  -webkit-text-stroke: 0.12em var(--pink);
  paint-order: stroke fill;
  /* A filter shadows the finished glyphs including the stroke; text-shadow
     on stroked text is drawn per glyph in WebKit and comes out broken on iOS. */
  filter: drop-shadow(0.05em 0.08em 0 var(--ink));
  text-transform: uppercase;
  line-height: 0.95;
  letter-spacing: 0.01em;
}
.slab { background: var(--paper); border: 4px solid var(--paper); border-radius: 24px; box-shadow: 0 6px 0 var(--ink); }
.btn {
  font-family: var(--display); font-weight: 400; font-size: 20px; text-transform: uppercase; letter-spacing: 0.02em;
  color: var(--paper); background: var(--pink);
  border: 3px solid var(--ink); border-radius: 999px; padding: 16px 22px;
  box-shadow: 0 5px 0 var(--ink); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
  text-shadow: 0 2px 0 rgba(0,0,0,0.25);
  transition: transform 80ms, box-shadow 80ms; user-select: none; white-space: nowrap;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn.blue { background: var(--blue); }
.btn.lilac { background: var(--lilac); }
.btn.mint { background: var(--mint); color: var(--ink); text-shadow: none; }
.btn.ghost { background: var(--paper); color: var(--ink); text-shadow: none; }
.btn[disabled] { background: #cfd3e0; color: #7a7f90; text-shadow: none; box-shadow: 0 5px 0 #8b8f9c; border-color: #8b8f9c; cursor: not-allowed; }
.btn svg { width: 24px; height: 24px; flex: none; }

.pop-in { animation: popin 360ms cubic-bezier(.2,1.4,.4,1); }
@keyframes popin { from { transform: translateY(18px) scale(0.96); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pop-in { animation: none !important; } .switch .knob { transition: none !important; } }

/* top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 18px 4px 10px; gap: 8px; }
.logo {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--pink); color: var(--paper);
  font-family: var(--display); font-size: 18px;
  padding: 8px 14px 8px 11px; border-radius: 999px; border: 3px solid var(--paper);
  box-shadow: 0 5px 0 var(--ink); transform: rotate(-2deg);
  text-shadow: 0 2px 0 var(--raspberry);
}
.logo svg { width: 28px; height: 22px; }
.chips { display: flex; gap: 4px; flex: none; }
.chip {
  background: var(--ink); color: var(--paper); font-weight: 700; font-size: 12.5px;
  padding: 8px 14px; border-radius: 999px; border: 0; font-family: var(--body); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
h1.shout { font-size: 34px; margin: 8px 0 16px; transform: rotate(-1.5deg); }
h2.shout { font-size: 26px; margin: 0; }

/* leaderboard */
.board { padding: 4px 0 6px; overflow: hidden; }
.board-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px 10px; border-bottom: 3px dashed #e9ecf4; }
.board-head h1 { font-size: 30px; margin: 0; transform: rotate(-1.5deg); }
.board-head .count { font-weight: 700; color: var(--lilac); font-size: 14px; text-align: right; line-height: 1.15; }
.board-head .count small { display: block; color: var(--faint); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.row {
  display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 12px;
  padding: 9px 14px 9px 12px; border-bottom: 2px solid #f0f2f8; cursor: pointer; transition: background 120ms;
}
.row:last-child { border-bottom: 0; }
.row:active { background: var(--cream); }
.row.top1 { background: linear-gradient(90deg, #fff3c2, #fff 70%); }
.hex {
  width: 44px; height: 44px; display: grid; place-items: center;
  font-family: var(--display); font-size: 20px; color: var(--paper); background: var(--lilac);
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  position: relative; text-shadow: 0 2px 0 rgba(0,0,0,0.3);
}
.hex.gold { background: var(--gold); color: var(--ink); text-shadow: none; }
.hex.silver { background: #d6dcf0; color: var(--ink); text-shadow: none; }
.hex.bronze { background: #f2a25c; color: var(--ink); text-shadow: none; }
.who { min-width: 0; }
.who .name { font-weight: 700; font-size: 17px; line-height: 1.1; display: flex; align-items: center; gap: 6px; min-width: 0; }
.who .name span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .name svg { width: 22px; height: 18px; flex: none; }
.who .rec { font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 2px; }
.who .rec b { color: var(--mint-deep); }
.rating {
  font-family: var(--display); font-size: 24px; color: var(--ink); background: var(--cream);
  border: 3px solid var(--ink); border-radius: 999px; padding: 4px 0; box-shadow: 0 3px 0 var(--ink);
  width: 92px; flex: none; text-align: center; font-variant-numeric: tabular-nums;
}
.row.top1 .rating { background: var(--gold); }
.row.fresh .rating { background: #eef1ff; }
.empty { padding: 26px 18px; text-align: center; font-weight: 600; color: var(--muted); }

/* record match */
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 14px 12px 18px; margin-bottom: 20px; cursor: pointer; user-select: none; }
.toggle-row .tlabel b { display: block; font-family: var(--display); font-weight: 400; font-size: 19px; text-transform: uppercase; letter-spacing: 0.02em; }
.toggle-row .tlabel span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 2px; }
.toggle-row.on .tlabel b { color: var(--raspberry); }
.switch {
  flex: none; width: 78px; height: 44px; border-radius: 999px; border: 3px solid var(--ink);
  background: #dfe3ef; box-shadow: 0 4px 0 var(--ink); position: relative; padding: 0; margin: 0; cursor: pointer;
  transition: background 160ms; font-family: var(--display);
}
.switch .knob {
  position: absolute; top: 3px; left: 3px; width: 32px; height: 32px; border-radius: 50%;
  background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 2px 0 var(--ink);
  display: grid; place-items: center; font-size: 10px; color: var(--faint); text-transform: uppercase;
  transition: transform 200ms cubic-bezier(.3,1.5,.5,1), color 160ms;
}
.switch[aria-checked="true"] { background: var(--pink); }
.switch[aria-checked="true"] .knob { transform: translateX(34px); color: var(--raspberry); }

.side { padding: 14px 14px 16px; margin-bottom: 18px; position: relative; }
.side.a { background: #e3f6ff; }
.side.b { background: #ffe4f2; }
.side .label {
  position: absolute; top: -14px; left: 14px; font-family: var(--display); font-size: 15px; text-transform: uppercase;
  color: var(--paper); padding: 4px 14px; border-radius: 999px; border: 3px solid var(--paper); box-shadow: 0 3px 0 var(--ink); transform: rotate(-2deg);
}
.side.a .label { background: var(--blue); }
.side.b .label { background: var(--pink); }
.field { position: relative; margin-top: 8px; }
.field + .field { margin-top: 10px; }
.field input {
  width: 100%; font-family: var(--body); font-weight: 600; font-size: 18px;
  padding: 14px 16px 14px 46px; border: 3px solid var(--ink); border-radius: 18px;
  background: var(--paper); color: var(--ink); outline: none; box-shadow: inset 0 3px 0 rgba(0,0,0,0.06);
}
.field.plain input { padding-left: 16px; }
.field input:focus { border-color: var(--deep); box-shadow: 0 0 0 4px rgba(0,181,254,0.35); }
/* scroll-margin so scrollIntoView leaves the label above the field visible */
.field input { scroll-margin-top: 28px; }
.field input::placeholder { color: #a0a5b8; font-weight: 500; }
.field .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; pointer-events: none; }
.picked {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; padding: 10px 12px 10px 16px;
}
.picked b { font-size: 18px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picked button { font-family: var(--body); font-weight: 700; font-size: 13px; background: var(--ink); color: var(--paper); border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; flex: none; }
.vs { text-align: center; margin: -10px 0 10px; font-family: var(--display); font-size: 22px; color: var(--paper); -webkit-text-stroke: 0.1em var(--ink); paint-order: stroke fill; }
.winner-title { text-align: center; font-weight: 700; font-size: 15px; color: var(--paper); text-shadow: 0 2px 0 rgba(0,0,0,0.3); margin: 6px 0 10px; text-transform: uppercase; letter-spacing: 0.06em; }
.winners { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 6px; }
.win {
  min-height: 118px; border: 4px solid var(--ink); border-radius: 24px; background: var(--paper); box-shadow: 0 6px 0 var(--ink);
  padding: 14px 10px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-align: center; transition: transform 100ms, box-shadow 100ms, background 120ms; position: relative; user-select: none;
  font-family: var(--body); color: var(--ink);
}
.win:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.win .crown { width: 44px; height: 34px; opacity: 0.18; transition: opacity 120ms, transform 200ms; }
.win .wname { font-weight: 700; font-size: 16px; line-height: 1.15; min-height: 2.3em; display: flex; align-items: center; }
.win .wname.empty { color: #a0a5b8; font-weight: 500; }
.win .tag { font-family: var(--display); font-size: 13px; text-transform: uppercase; color: #a0a5b8; }
.win.a.on { background: var(--blue); }
.win.b.on { background: var(--pink); }
.win.on .crown { opacity: 1; transform: rotate(-8deg) scale(1.15); }
.win.on .wname, .win.on .tag { color: var(--paper); text-shadow: 0 2px 0 rgba(0,0,0,0.3); }
.win.on::after {
  content: "WINNER"; position: absolute; top: -12px; right: -6px; background: var(--gold); color: var(--ink);
  font-family: var(--display); font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 3px solid var(--ink); transform: rotate(6deg);
}
.error { background: var(--paper); border: 3px solid var(--raspberry); color: var(--raspberry); border-radius: 16px; padding: 10px 14px; font-weight: 700; margin: 12px 0; }

/* player page */
.hero-card { padding: 18px 18px 16px; display: grid; grid-template-columns: 84px 1fr; gap: 16px; align-items: center; margin-bottom: 18px; background: var(--paper); }
.hero-card .hex { width: 84px; height: 84px; font-size: 36px; }
.hero-card h2 { font-size: 24px; margin: 0 0 6px; word-break: break-word; }
.hero-card .num { font-family: var(--display); font-size: 44px; line-height: 1; color: var(--ink); display: flex; align-items: baseline; gap: 8px; }
.hero-card .num small { font-family: var(--body); font-weight: 700; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.hero-card .rec { margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
.hero-card .rec span { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 2px solid var(--ink); background: var(--paper); }
.hero-card .rec span.w { background: var(--mint); }
.hero-card .rec span.l { background: #ffd0e5; }
.card { padding: 16px; margin-bottom: 18px; }
.card h3 { font-family: var(--display); font-weight: 400; font-size: 18px; text-transform: uppercase; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
.card h3 span { font-family: var(--body); font-weight: 700; font-size: 13px; color: var(--muted); }
.card.graph-card { padding: 16px 10px 12px; }
.card.graph-card h3 { padding: 0 6px; }

.graph-wrap { position: relative; touch-action: pan-y; }
.graph { width: 100%; height: auto; display: block; overflow: visible; cursor: crosshair; }
.graph text { font-family: var(--body); font-weight: 700; }
.graph .grid { stroke: #eceef5; stroke-width: 2; }
.graph .tick { fill: var(--faint); font-size: 11px; }
.graph .base-line { stroke: var(--lilac); stroke-width: 2.5; stroke-dasharray: 5 6; stroke-linecap: round; }
.graph .base-cap { fill: var(--lilac); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
.graph .ink { fill: none; stroke: var(--ink); stroke-width: 7.5; stroke-linejoin: round; stroke-linecap: round; }
.graph .seg { fill: none; stroke-width: 3.5; stroke-linecap: round; }
.graph .seg.up { stroke: var(--mint); }
.graph .seg.down { stroke: var(--pink); }
.graph .pt { stroke: var(--ink); stroke-width: 2.5; }
.graph .pt.up { fill: var(--mint); }
.graph .pt.down { fill: var(--pink); }
.graph .pt.start { fill: var(--lilac); }
.graph .pt.last { fill: var(--gold); }
.graph .hl { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 3 4; opacity: 0.55; }
.graph .now rect { fill: var(--gold); stroke: var(--ink); stroke-width: 2.5; }
.graph .now .val { font-family: var(--display); font-weight: 400; font-size: 16px; fill: var(--ink); }
.graph .now .cap { font-size: 9px; fill: var(--ink); text-transform: uppercase; letter-spacing: 0.1em; }
.graph .axis { fill: var(--faint); font-size: 11px; }
.tip {
  position: absolute; z-index: 5; background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink);
  padding: 8px 12px 9px; font-size: 13px; line-height: 1.25; white-space: nowrap; pointer-events: none;
  transform: translate(-50%, calc(-100% - 18px));
}
.tip::after { content: ""; position: absolute; left: 50%; bottom: -10px; width: 14px; height: 14px; background: var(--paper); border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
.tip.l { transform: translate(-22px, calc(-100% - 18px)); } .tip.l::after { left: 22px; }
.tip.r { transform: translate(calc(-100% + 22px), calc(-100% - 18px)); } .tip.r::after { left: auto; right: 15px; transform: rotate(45deg); }
.tip .tdate { font-size: 11px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; }
.tip .twho { font-weight: 700; font-size: 15px; margin: 2px 0 5px; }
.tip .tline { display: flex; align-items: center; gap: 7px; font-weight: 700; color: var(--muted); }
.tip .d { font-family: var(--display); font-weight: 400; font-size: 15px; padding: 2px 10px; border-radius: 999px; border: 2.5px solid var(--ink); }
.tip .d.up { background: var(--mint); color: var(--ink); }
.tip .d.down { background: var(--pink); color: var(--paper); text-shadow: 0 1px 0 var(--raspberry); }
.tip .d.start { background: var(--lilac); color: var(--paper); }
.tip .tline b { color: var(--ink); font-size: 15px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 10px 6px 0; font-size: 12px; font-weight: 700; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); vertical-align: -2px; margin-right: 4px; }
.legend i.up { background: var(--mint); } .legend i.down { background: var(--pink); }
.legend i.base { width: 18px; height: 0; border: 0; border-top: 3px dashed var(--lilac); border-radius: 0; vertical-align: 2px; }

.match { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 2px solid #f0f2f8; }
.match:last-child { border-bottom: 0; }
.match.gone { opacity: 0.45; }
.match .opp { font-weight: 700; font-size: 16px; line-height: 1.15; }
.match .opp a { text-decoration: underline; text-decoration-color: rgba(34,33,38,0.25); }
.match .meta { font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.match .meta .type { background: var(--lilac); color: var(--paper); padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
.match .meta .type.doubles { background: var(--deep); }
.match .meta .type.deleted { background: var(--faint); }
.delta { font-family: var(--display); font-size: 20px; padding: 6px 14px; border-radius: 999px; border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); min-width: 74px; text-align: center; }
.delta.up { background: var(--mint); color: var(--ink); }
.delta.down { background: var(--pink); color: var(--paper); text-shadow: 0 2px 0 var(--raspberry); }
.delta.none { background: #eef1ff; color: var(--faint); box-shadow: none; }

/* create */
.form-card { padding: 18px; margin-bottom: 18px; }
.form-card h2 { font-size: 30px; margin: 4px 0 12px; }
.form-card label { display: block; font-weight: 700; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 2px 4px; }
.form-card .hint { font-size: 14px; color: var(--muted); font-weight: 600; margin: 10px 2px 14px; }
.form-card details summary { font-size: 14px; font-weight: 700; color: var(--deep); cursor: pointer; text-decoration: underline; margin: 0 2px 10px; list-style: none; }
.form-card details summary::-webkit-details-marker { display: none; }
.form-card .altbox { font-size: 14px; font-weight: 600; background: var(--cream); border: 2px dashed var(--ink); border-radius: 14px; padding: 10px 12px; margin-bottom: 6px; line-height: 1.35; }
.form-card .altbox p { margin: 0 0 8px; } .form-card .altbox p:last-child { margin: 0; }

/* log */
.log-row { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 10px 0; border-bottom: 2px solid #f0f2f8; }
.log-row > div:first-child { flex: 1 1 200px; min-width: 0; }
.log-row:last-child { border-bottom: 0; }
.log-row .what { font-weight: 700; font-size: 15px; line-height: 1.2; }
.log-row .what a { text-decoration: underline; text-decoration-color: rgba(34,33,38,0.25); }
.log-row .what.gone { text-decoration: line-through; color: var(--faint); }
.log-row .when { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 3px; }
.mini { font-family: var(--body); font-weight: 700; font-size: 13px; background: var(--paper); color: var(--raspberry); border: 2.5px solid var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; box-shadow: 0 2px 0 var(--ink); }
.mini[disabled] { opacity: 0.5; }

/* algorithm */
.prose-card { padding: 18px; font-size: 15px; line-height: 1.5; }
.prose-card h1 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0 0 12px; }
.prose-card h2 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 22px 0 8px; }
.prose-card a { color: var(--deep); font-weight: 700; white-space: nowrap; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--blue); }
.prose-card a::after { content: " ›"; }
.repo-line { display: inline-flex; align-items: center; gap: 8px; margin: -6px 4px 18px; color: var(--ink); font-weight: 700; font-size: 14px; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; cursor: pointer; }
.repo-line .gh { width: 18px; height: 18px; flex: none; }
.prose-card p { margin: 0 0 12px; }
.prose-card .katex-display { margin: 12px 0; overflow: visible; padding: 2px 0; }
.prose-card .katex-display > .katex { white-space: normal; }
.prose-card .katex { font-size: 1.12em; }

/* dock */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 80; display: flex; justify-content: center;
  padding: 26px 14px calc(14px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, rgba(0,181,254,1) 0%, rgba(0,181,254,0.96) 55%, rgba(0,181,254,0) 100%);

<div id="out"></div>
<script>
const CROWN = `<svg viewBox="0 0 64 48" aria-hidden="true"><path d="M6 40 L2 12 L20 24 L32 4 L44 24 L62 12 L58 40 Z" fill="#FFD046" stroke="#222126" stroke-width="5" stroke-linejoin="round"/><rect x="6" y="38" width="52" height="8" rx="3" fill="#FFFFFF" stroke="#222126" stroke-width="5"/></svg>`, FLAME = `<svg class="fl" viewBox="0 0 28 32" aria-hidden="true"><path d="M14 2c1.5 5 7 7.5 7 14.5a7 7 0 0 1-14 0c0-3 1.5-4.5 3-6 0 2.5 1.2 4 2.5 4 0-5-1.5-9 1.5-12.5z" fill="#ff6a00" stroke="#222126" stroke-width="2.4" stroke-linejoin="round"/><path d="M14 17c1.6 1.4 3 3 3 5.2a3 3 0 0 1-6 0c0-2.2 1.4-3.8 3-5.2z" fill="#ffd046"/><path d="M14 21.5c.6.5 1.1 1.2 1.1 2a1.1 1.1 0 0 1-2.2 0c0-.8.5-1.5 1.1-2z" fill="#fff6d5"/></svg>`;
function st(n, variant) {
  if (variant === 's3') return `<span class="st">${Array.from({length: Math.min(n,5)}).map(() => FLAME).join('')}<i>${n}</i></span>`;
  return `<span class="st">${FLAME}<i>${n}</i></span>`;
}
function row(rank, name, rec, rating, streak, variant, cls='') {
  const hex = rank===1?'gold':rank===2?'silver':rank===3?'bronze':'';
  const inName = variant==='s1'||variant==='s2'||variant==='s3';
  const onRating = variant==='s4';
  const onRec = variant==='s5';
  return `<div class="row ${cls}"><div class="hex ${hex}">${rank}</div><div class="who"><div class="name">${rank===1?CROWN:''}<span>${name}</span>${inName&&streak?st(streak,variant):''}</div><div class="rec"><b>${rec.split('·')[0]}</b>·${rec.split('·')[1]}${onRec&&streak?st(streak,variant):''}</div></div><div class="rating">${rating}${onRating&&streak?st(streak,variant):''}</div></div>`;
}
function board(v) {
  return `<div class="board slab"><div class="board-head"><h1 class="shout" style="font-size:24px">Leaderboard</h1><div class="count">18<small>players</small></div></div>
  ${row(1,'Priya Raman','13W · 2L',1135,6,v,'top1')}${row(2,'Tomás Ferreira','5W · 2L',1048,4,v)}${row(3,'Anders Bekkevard','8W · 6L',1029,0,v)}${row(4,'Zed Newcomer','3W · 1L',1020,3,v)}</div>`;
}
function hero(v) {
  const onNum = v==='s4';
  return `<div class="hero-card slab" style="margin-top:14px"><div class="hex gold">1</div><div><h2 class="shout">Priya Raman</h2><div class="num">1135<small>rating</small>${onNum?st(3,v):''}</div><div class="rec"><span class="w">13 W</span><span class="l">2 L</span><span>#1 of 18</span>${!onNum?st(3,v):''}</div></div></div>`;
}
const V = [
  ['S1','Big flame by the name, count as a pip', 's1', 'The flame is 24 px, brighter, with a yellow core. The count sits on its shoulder in a small ink pip, the way an app badge does. Nothing else in the row changes.'],
  ['S2','Flame coin', 's2', 'An orange disc with the ink rim and hard shadow, the flame in yellow inside, the count in a white pip. Reads as a medal next to the crown.'],
  ['S3','One flame per win', 's3', 'No number at all on the board: three wins is three flames, capped at five. The card spells it out.'],
  ['S4','Flame perched on the rating', 's4', 'The flame sits on the top-left corner of the rating pill with the count inside the flame. Ties the streak to the number it is pushing up.'],
  ['S5','Flame on the record line, no pill', 's5', 'Where the badge is today, but no pill: a larger flame and a small bold count in flame orange. Quiet, but the flame carries it.'],
];
document.getElementById('out').innerHTML = V.map(([n,t,c,note]) => `<span class="x-label"><b>${n}</b>${t}</span><div class="x-note">${note}</div><div class="x-row"><div class="frame ${c}">${board(c)}${hero(c)}</div></div>`).join('');
</script>
</body></html>
